# Parallel iOS Starter Kit 2.0.1 — XMNote project configuration.

IOS_CONTAINER_TYPE="project"
IOS_CONTAINER_PATH="XMNote.xcodeproj"
IOS_SCHEME="xmnote"
IOS_CONFIGURATION="Debug"

IOS_APP_NAME="xmnote.app"
IOS_BUNDLE_ID="com.merpyzf.xmnote"

XCODE_DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer"

SIM_DEVICE_TYPE_ID="com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro"
SIM_RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-26-5"
SIM_TEMPLATE_UDID=""
IOS_SIMULATOR_NAME_PREFIX="XMNote-AI"

# Keep task branches aligned with the repository's Codex naming convention.
IOS_TASK_BRANCH_PREFIX="codex/"

# Cleanup is invoked only after explicit user approval. It never deletes branches or shared caches.
IOS_TASK_CLEANUP_POLICY="delete"

# Disk capacity is sufficient for fully isolated task checkouts and build products.
IOS_PACKAGE_MODE="isolated"

TOP_LEVEL_BUILD_LIMIT=2
XCODEBUILD_JOBS=4

IOS_PARALLEL_TESTING="NO"
IOS_TEST_SIMULATOR_LIMIT=1

IOS_COMPILATION_CACHE="YES"
IOS_COMPILATION_CACHE_DIAGNOSTICS="NO"

# Empty values use the Starter Kit's sibling state directory defaults.
PARALLEL_STATE_ROOT=""
PARALLEL_WORKTREE_PARENT=""
